name: build-and-demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:          # ручной запуск по кнопке

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Сборка и тесты
        run: mvn -B clean verify

  demo:
    runs-on: ubuntu-latest
    needs: tests             # демо запускается, только если тесты зелёные
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Демо-запуск приложения
        run: |
          printf '1\n2\n5\n3\n2\n2 - 1\n3\n0\n' | mvn -B compile exec:java -q
